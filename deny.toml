# cargo-deny: Lizenzen und Sicherheitsmeldungen der Abhängigkeiten prüfen.
# Projektlizenz: MIT OR Apache-2.0 – nur permissive Lizenzen erlaubt.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
    "MIT",
    "MIT-0",           # borrow-or-share (nur Test-Abhängigkeit jsonschema)
    "Apache-2.0",
    "Unicode-3.0",
    "Zlib",
    "Unlicense",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
]
confidence-threshold = 0.9

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
