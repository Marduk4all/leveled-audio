name: Feature request
description: Suggest an idea or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to achieve?
      description: Describe your use case, e.g. "I produce a weekly video podcast and …". You can write in English or German.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How could Leveled Audio help? Mockups or examples from other tools are welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: How do you solve it today?
