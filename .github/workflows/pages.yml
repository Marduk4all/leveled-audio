name: Website

# Baut die Projektseite aus site/ (plus Bilder aus docs/images und assets)
# und veröffentlicht sie auf GitHub Pages:
# https://marduk4all.github.io/leveled-audio/

on:
  push:
    branches: [main]
    paths: ["site/**", "docs/images/**", "assets/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Seite zusammenstellen
        run: |
          mkdir -p _site/images
          cp -r site/. _site/
          cp docs/images/gui-*-en.png docs/images/gui-*-de.png docs/images/social-preview.jpg _site/images/
          cp assets/icon-256.png _site/images/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
